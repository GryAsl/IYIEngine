org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
# Per-game values come from the command line (tools/release.py --platform android passes them):
#   -Piyi.applicationId=...  -Piyi.appName=...  -Piyi.versionCode=1  -Piyi.versionName=0.1
#   -Piyi.gameRres=<path to game.rres>  -Piyi.pythonPrefix=<CPython Android prefix>
#   -Piyi.generatedInclude=<dir holding IYI/ReleaseSecret.h>  (required: mobile always loads the packed game)
#   -Piyi.playGamesAppId=...  -Piyi.licensePublicKey=...  -Piyi.playAchievementIds=NAME=playId;NAME=playId
#     (Google Play bridge, engine.play: all absent/empty = off; see docs/spec/mobile.md)
